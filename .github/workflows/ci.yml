name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  bash-checks:
    name: Bash scripts check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x check_api.sh analyze_logs.sh

      - name: Syntax check
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
          echo "Синтаксис корректен"

      - name: Test check_api.sh (expect exit code 0)
        run: ./check_api.sh https://httpbin.org/status/200

      - name: Test analyze_logs.sh
        run: ./analyze_logs.sh
